# SPDX-License-Identifier: Apache-2.0
#
# micro-ROS demo for NUCLEO-F767ZI on Zephyr (UDP over Ethernet transport)
#
# Base copy: micro-ROS Zephyr module sample prj.conf
# https://github.com/micro-ROS/micro_ros_zephyr_module

CONFIG_GPIO=y
CONFIG_MICROROS=y
CONFIG_CPP=y

CONFIG_MAIN_STACK_SIZE=25000
CONFIG_MAIN_THREAD_PRIORITY=3

CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_NANO=n
CONFIG_PTHREAD_IPC=n

CONFIG_POSIX_API=y
CONFIG_POSIX_CLOCK=y

CONFIG_STDOUT_CONSOLE=y
CONFIG_LOG=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y

# --------------------------------------------------------------
# micro-ROS transport: UDP over Ethernet
# --------------------------------------------------------------
# Kconfig is a choice: pick exactly one transport.
CONFIG_MICROROS_TRANSPORT_UDP=y

# Where the micro-ROS agent (Raspberry Pi, Docker) is reachable.
# *** CHANGE THIS to your Pi's IP (see: hostname -I on the Pi) ***
CONFIG_MICROROS_AGENT_IP="192.168.1.100"
CONFIG_MICROROS_AGENT_PORT="8888"

# --------------------------------------------------------------
# Networking stack (Ethernet, DHCP)
# --------------------------------------------------------------
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_UDP=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_ETH_STM32_HAL=y

# LAN8742A PHY on the Nucleo-144 boards sits at SMI address 0 (Zephyr default).
# If you get no link/activity for the eth0 interface, try 1:
# CONFIG_ETH_STM32_HAL_PHY_ADDRESS=1

# Default: obtain our own address with DHCP
CONFIG_NET_DHCPV4=y

# Alternative: static IP (replace the CONFIG_NET_DHCPV4=y line above with this block)
# CONFIG_NET_DHCPV4=n
# CONFIG_NET_CONFIG_SETTINGS=y
# CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.168.1.50"
# CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
# CONFIG_NET_CONFIG_MY_IPV4_GW="192.168.1.1"

# --------------------------------------------------------------
# Optional debug help (uncomment if the agent/board cannot connect)
# --------------------------------------------------------------
# CONFIG_NET_LOG=y
# CONFIG_NET_IF_LOG_LEVEL_DBG=y
# CONFIG_NET_DHCPV4_LOG_LEVEL_DBG=y
